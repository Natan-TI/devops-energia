# Pipeline DevSecOps: roda a cada push. Se qualquer verificação falhar, nada é publicado.
name: Pipeline DevSecOps

on:
  push:
  pull_request:
  workflow_dispatch:

# Permissão mínima por padrão; cada job pede só o que precisa.
permissions:
  contents: read

concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: true

# As ações são fixadas pelo hash do commit, e não pela etiqueta, que pode ser movida.
jobs:
  testes:
    name: Testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest

  gitleaks:
    name: Gitleaks (segredos no repositório)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # histórico completo: um segredo apagado depois ainda é um vazamento
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  semgrep:
    name: Semgrep (análise do código)
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: >
          semgrep scan --error --metrics=off
          --config p/default --config p/python --config p/dockerfile --config p/docker-compose --config p/terraform

  imagem:
    name: Build e Trivy (imagem e configuração)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build da imagem
        run: docker build -t energia-painel:${{ github.sha }} .
      - name: Trivy na imagem (vulnerabilidades altas e críticas)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: energia-painel:${{ github.sha }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
      - name: Trivy na configuração (Dockerfile, compose e Terraform)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: "1"

  deploy:
    name: Deploy na AWS
    # Só publica o que passou em todas as verificações, e só a partir da branch principal.
    # O ambiente do AWS Academy fica no ar por poucas horas: o deploy é ligado pela variável
    # DEPLOY_ATIVO do repositório enquanto o laboratório está aberto.
    needs: [testes, gitleaks, semgrep, imagem]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.DEPLOY_ATIVO == 'true'
    runs-on: ubuntu-latest
    environment:
      name: producao
      url: ${{ steps.publicar.outputs.url }}
    concurrency:
      group: deploy-producao
      cancel-in-progress: false
    steps:
      - name: Credenciais da AWS (GitHub Secrets)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Publicar o commit pelo Systems Manager (sem SSH)
        id: publicar
        env:
          COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          instancia=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=energia-painel" "Name=instance-state-name,Values=running" \
            --query "Reservations[0].Instances[0].InstanceId" --output text)
          endereco=$(aws ec2 describe-instances --instance-ids "$instancia" \
            --query "Reservations[0].Instances[0].PublicIpAddress" --output text)
          echo "Máquina: $instancia ($endereco)"

          comando=$(aws ssm send-command --instance-ids "$instancia" \
            --document-name AWS-RunShellScript --comment "Deploy $COMMIT" \
            --parameters "commands=['set -e','cd /opt/energia-painel','git fetch --quiet origin','git checkout --quiet --force $COMMIT','bash infra/deploy.sh']" \
            --query "Command.CommandId" --output text)

          # Acompanha o comando por até 10 minutos (o build da imagem acontece na máquina).
          estado=Pending
          for tentativa in $(seq 1 60); do
            sleep 10
            estado=$(aws ssm get-command-invocation --command-id "$comando" --instance-id "$instancia" \
              --query Status --output text 2>/dev/null || echo Pending)
            echo "Deploy: $estado"
            case "$estado" in Pending|InProgress|Delayed) ;; *) break ;; esac
          done
          aws ssm get-command-invocation --command-id "$comando" --instance-id "$instancia" \
            --query "{saida: StandardOutputContent, erro: StandardErrorContent}" --output text
          [ "$estado" = "Success" ]
          echo "url=http://$endereco" >> "$GITHUB_OUTPUT"

      - name: Conferir o painel publicado
        run: curl --fail --silent --show-error --retry 5 --retry-delay 5 "${{ steps.publicar.outputs.url }}/health"
