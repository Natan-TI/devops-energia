# Coleta as métricas do painel a cada 5 segundos e avalia as regras de alerta.
global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alertas.yml

scrape_configs:
  - job_name: painel
    metrics_path: /metrics
    # O alvo vem da variável ALVO (veja docker-compose.observabilidade.yml):
    # "api:8000" para o painel local ou "endereço:porta" do painel publicado na nuvem.
    file_sd_configs:
      - files: [/tmp/alvos.json]
